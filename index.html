<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <!-- Google Fonts: Inter for clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- TOP BRAND & CONTROLS -->
        <div class="top-bar">
            <div class="app-brand">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>Life Dashboard</span>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn">
                <svg class="icon-svg" id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span id="themeText">Dark Mode</span>
            </button>
        </div>

        <!-- GREETING CARD -->
        <div class="card greeting-card">
            <div class="clock-display" id="clockDisplay">00:00:00</div>
            <div class="date-display" id="dateDisplay">Loading date...</div>
            <div class="greeting-wrapper">
                <svg class="icon-svg greeting-icon" id="greetingIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <span class="greeting-text" id="greetingText">Good Morning,</span>
                <input type="text" class="name-input" id="nameInput" placeholder="Your Name" title="Click to edit name">
            </div>
        </div>

        <!-- MAIN GRID CONTENT -->
        <div class="main-grid">
            
            <!-- LEFT COLUMN -->
            <div class="left-column">
                
                <!-- FOCUS TIMER CARD -->
                <div class="card timer-card">
                    <div class="card-title">
                        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>Focus Timer</span>
                    </div>

                    <div class="timer-preset-group">
                        <button class="btn-chip" data-time="15">15m</button>
                        <button class="btn-chip active" data-time="25">25m</button>
                        <button class="btn-chip" data-time="45">45m</button>
                        <button class="btn-chip" data-time="50">50m</button>
                    </div>

                    <div class="timer-display" id="timerDisplay">25:00</div>

                    <div class="timer-status" id="timerStatus" data-state="idle" role="status" aria-live="polite">
                        <span class="status-dot"></span>
                        <span id="timerStatusText">Ready to focus</span>
                    </div>

                    <div class="timer-controls">
                        <button class="btn btn-primary" id="startTimerBtn">
                            <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> <span id="startTimerLabel">Start</span>
                        </button>
                        <button class="btn btn-secondary" id="stopTimerBtn" disabled>
                            <svg class="icon-svg" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Stop
                        </button>
                        <button class="btn btn-secondary" id="resetTimerBtn">
                            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Reset
                        </button>
                    </div>
                </div>

                <!-- QUICK LINKS CARD -->
                <div class="card">
                    <div class="card-title">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>Quick Links</span>
                    </div>
                    
                    <form class="quick-links-form" id="linkForm">
                        <input type="text" id="linkNameInput" class="input-field" placeholder="Name (e.g. Google)" required>
                        <input type="url" id="linkUrlInput" class="input-field" placeholder="URL (https://...)" required>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </form>

                    <div class="links-container" id="linksContainer"></div>
                </div>

            </div>

            <!-- RIGHT COLUMN: TO-DO LIST -->
            <div class="card todo-card">
                <div class="card-title">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span>Tasks & To-Do</span>
                </div>

                <form class="todo-form" id="todoForm">
                    <input type="text" id="todoInput" class="input-field" placeholder="Add a new task..." required>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>

                <div class="todo-tools">
                    <span id="taskCount">0 tasks</span>
                    <div>
                        <label for="sortSelect">Sort: </label>
                        <select id="sortSelect" class="sort-select">
                            <option value="added">Date Added</option>
                            <option value="status">Status (Pending First)</option>
                            <option value="alpha">Alphabetical</option>
                        </select>
                    </div>
                </div>

                <ul class="todo-list" id="todoList"></ul>
            </div>

        </div>
    </div>

    <!-- TOAST ALERT FOR DUPLICATES -->
    <div class="toast-message" id="toastMessage">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="toastText">Task already exists!</span>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script src="script.js" defer></script>
</body>
</html>
